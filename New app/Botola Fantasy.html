<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Botola Pro Fantasy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0a0a0f; min-height: 100vh; }
  body {
    font-family: 'Space Grotesk', 'Inter', -apple-system, system-ui, sans-serif;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
  }
  #root { width: 100%; display: flex; justify-content: center; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="screens-home.jsx"></script>
<script type="text/babel" src="screens-pick.jsx"></script>
<script type="text/babel" src="screens-market.jsx"></script>
<script type="text/babel" src="screens-live.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "pitchView": "list",
  "accent": "#00FF87",
  "language": "AR"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = React.useState({ name: 'onboarding' });
  const [dataLoaded, setDataLoaded] = React.useState(false);
  const [dataError, setDataError] = React.useState(null);

  // Update CSS accent globally for visual tweak
  React.useEffect(() => {
    if (tweaks.accent && tweaks.accent !== '#00FF87') {
      window.T.primary = tweaks.accent;
    }
  }, [tweaks.accent]);

  React.useEffect(() => {
    if (window.loadScrapperData) {
      window.loadScrapperData()
        .then(() => setDataLoaded(true))
        .catch(err => setDataError(err.message));
    } else {
      setDataLoaded(true);
    }
  }, []);

  if (dataError) {
    return (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', width: '100vw' }}>
        <div style={{ fontFamily: 'Space Grotesk', fontSize: 18, color: '#FF3B57', background: '#1A2040', padding: '20px 40px', borderRadius: 16 }}>
          {dataError}
        </div>
      </div>
    );
  }

  if (!dataLoaded) {
    return <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', width: '100vw', fontFamily: 'Space Grotesk', color: '#A6ADD0' }}>Loading Gameweek...</div>;
  }

  const nav = (name, params) => {
    if (name === 'home' || name === 'pick' || name === 'transfers' || name === 'live' || name === 'leagues') {
      setRoute({ name });
    } else {
      setRoute({ name, ...params });
    }
  };

  const tab = ['home','pick','transfers','live','leagues'].includes(route.name) ? route.name : null;

  return (
    <>
      <IOSDevice dark={true} width={402} height={874}>
        <div style={{ position: 'absolute', top: 62, left: 0, right: 0, bottom: 0, background: '#06070D', overflow: 'hidden' }} data-screen-label={route.name}>
          {route.name === 'onboarding' && <Onboarding onContinue={() => nav('home')}/>}
          {route.name === 'home'      && <HomeScreen onNav={nav}/>}
          {route.name === 'pick'      && <PickTeamScreen tweaks={tweaks} setTweak={setTweak}/>}
          {route.name === 'transfers' && <MarketScreen onSelectPlayer={(id) => nav('player', { playerId: id })}/>}
          {route.name === 'player'    && <PlayerProfile playerId={route.playerId} onBack={() => nav('transfers')}/>}
          {route.name === 'live'      && <LiveScreen/>}
          {route.name === 'leagues'   && <LeaguesScreen onOpen={(l) => nav('standings', { league: l })}/>}
          {route.name === 'standings' && <StandingsScreen league={route.league} onBack={() => nav('leagues')}/>}

          {tab && <TabBar active={tab} onChange={nav}/>}
        </div>
      </IOSDevice>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Pitch View">
          <TweakRadio label="Style" value={tweaks.pitchView} options={[
            { value: '2d', label: '2D' },
            { value: '3d', label: '3D' },
            { value: 'list', label: 'List' },
          ]} onChange={(v) => setTweak('pitchView', v)}/>
        </TweakSection>
        <TweakSection label="Theme">
          <TweakColor label="Accent" value={tweaks.accent} onChange={(v) => setTweak('accent', v)}/>
        </TweakSection>
        <TweakSection label="Language">
          <TweakRadio label="Locale" value={tweaks.language} options={[
            { value: 'EN', label: 'EN' },
            { value: 'FR', label: 'FR' },
            { value: 'AR', label: 'AR' },
          ]} onChange={(v) => setTweak('language', v)}/>
        </TweakSection>
        <TweakSection label="Navigation">
          <TweakButton label="Onboarding" onClick={() => setRoute({ name: 'onboarding' })}/>
          <TweakButton label="Home" onClick={() => setRoute({ name: 'home' })} secondary/>
          <TweakButton label="Pick Team" onClick={() => setRoute({ name: 'pick' })} secondary/>
          <TweakButton label="Market" onClick={() => setRoute({ name: 'transfers' })} secondary/>
          <TweakButton label="Player" onClick={() => setRoute({ name: 'player', playerId: 50 })} secondary/>
          <TweakButton label="Live" onClick={() => setRoute({ name: 'live' })} secondary/>
          <TweakButton label="Leagues" onClick={() => setRoute({ name: 'leagues' })} secondary/>
          <TweakButton label="Standings" onClick={() => setRoute({ name: 'standings', league: LEAGUES[0] })} secondary/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
